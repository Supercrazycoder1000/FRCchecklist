<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Checklist</title>

<style>
  :root{
    --bg:#0f1116;
    --text:#d6d6d6;
    --muted:#9aa3b2;
    --active:#1c1f26;
    --border:#2a3142;
    --good:#4caf50;
    --warn:#ffb020;
    --panel: rgba(15,17,22,0.95);
    --shadow: 0 4px 12px rgba(0,0,0,0.35);
  }

  /* Light theme overrides */
  [data-theme="light"]{
    --bg:#f6f7fb;
    --text:#1b1f2a;
    --muted:#4d5870;
    --active:#e9edf6;
    --border:#cfd7e6;
    --good:#2e7d32;
    --warn:#b45309;
    --panel: rgba(246,247,251,0.92);
    --shadow: 0 4px 12px rgba(10,20,40,0.12);
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    margin:0;
    padding:24px;
  }
  .wrap{max-width:980px;margin:0 auto;}

  header{
    position: sticky;
    top: 0;
    z-index: 1000;

    background: var(--panel);
    backdrop-filter: blur(6px);

    padding: 12px 0 16px 0;

    display:flex;
    flex-direction:column;
    gap:10px;

    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  .topRow{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  h1{margin:0;font-weight:650;font-size:28px; flex: 1 1 auto;}

  .controls{
    display:flex;
    gap:10px;
    align-items:center;
    flex: 0 0 auto;
  }

  select, button{
    font: inherit;
    color: var(--text);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    cursor: pointer;
  }
  [data-theme="light"] select,
  [data-theme="light"] button{
    background: rgba(0,0,0,0.03);
  }

  .sub{color:var(--muted);font-size:14px;line-height:1.35;}

  .barWrap{
    background:rgba(0,0,0,0.18);
    border:1px solid var(--border);
    border-radius:999px;
    overflow:hidden;
    height:16px;
  }
  [data-theme="light"] .barWrap{ background: rgba(0,0,0,0.06); }

  .bar{
    height:100%;
    width:0%;
    background:var(--good);
    transition:width .15s ease;
  }

  .barMeta{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:13px;
    margin-top:6px;
    gap:12px;
    align-items:center;
  }

  .pill{
    display:inline-flex;gap:8px;align-items:center;
    padding:6px 10px;border:1px solid var(--border);
    border-radius:999px;background:rgba(255,255,255,.02);
    color:var(--muted);
    width:fit-content;
  }
  [data-theme="light"] .pill{ background: rgba(0,0,0,0.03); }
  .pill strong{color:var(--text);font-weight:600;}
  .lock{color:var(--warn);}

  ul{list-style:none;padding:0;margin:14px 0 0;}
  li{
    padding:8px 10px;
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:10px;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  li:active{transform:scale(0.995);}
  li.active{background:var(--active); outline:1px solid rgba(255,255,255,.06);}
  [data-theme="light"] li.active{ outline: 1px solid rgba(0,0,0,.06); }

  .circle{
    width:18px;height:18px;border:2px solid #666;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .done .circle{background:var(--good);border-color:var(--good);}
  .circle .tick{font-size:12px;line-height:1;color:white;opacity:0;}
  .done .circle .tick{opacity:1;}

  .text{font-size:16px; line-height:1.3;}
  .muted{color:var(--muted);}

  .sectionRow{font-weight:650;color:var(--text);}
  .sectionRow .circle{border-color:#3b445d;}
  [data-theme="light"] .sectionRow .circle{border-color:#97a3b8;}

  .sectionRow.done{opacity:.9;}
  .sectionRow.done .circle{background:rgba(76,175,80,.25);border-color:rgba(76,175,80,.6);}
  .sectionRow.done .circle .tick{opacity:1;}

  .done .text{text-decoration:line-through;opacity:.65;}

  /* indentation */
  .level-0{margin-left:0px;}
  .level-1{margin-left:22px;}
  .level-2{margin-left:44px;}
  .level-3{margin-left:66px;}

  .twisty{
    width:18px; height:18px;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--muted);
    border:1px solid transparent;
    border-radius:6px;
    flex:0 0 auto;
  }
  .sectionRow .twisty{border-color:rgba(255,255,255,.06);}
  [data-theme="light"] .sectionRow .twisty{border-color:rgba(0,0,0,.08);}
  .collapsed .twisty{transform:rotate(-90deg);}
  .twisty svg{width:14px;height:14px;}

  @media (pointer: coarse) {
    li{padding:14px 12px;}
    .text{font-size:18px;}
    .circle{width:22px;height:22px;}
    select, button{padding:10px 12px;}
  }

</style>
</head>

<body>
<div class="wrap">
  <header>
    <div class="topRow">
      <h1 id="title">Checklist</h1>
      <div class="controls">
        <select id="checklistSelect" aria-label="Select checklist"></select>
        <button id="themeBtn" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="barWrap" aria-label="Progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="barMeta">
      <div id="progressText">0/0 complete</div>
      <div class="pill" id="gatePill">
        <span class="lock">⚠</span>
        <span><strong>START UP</strong> locked until PREFLIGHT complete</span>
      </div>
    </div>

    <div class="sub">
      Keyboard: ↑/↓ move, Enter toggle, Space expand/collapse section.<br/>
      Touch/click: tap item to toggle, tap section title to collapse/expand.
    </div>
  </header>

  <ul id="list"></ul>
</div>

<script>
/**
 * Multiple checklist support:
 * Add entries here and create the XML files under /checklists/.
 */
const CHECKLISTS = [
  { id: "robot_electrical", label: "Robot Electrical", file: "./checklists/robot_electrical.xml" },
  //{ id: "robot_mechanical", label: "Robot Mechanical", file: "./checklists/robot_mechanical.xml" },
  // Add more like this:
  // { id: "robot_mechanical", label: "Robot Mechanical", file: "./checklists/robot_mechanical.xml" },
  // { id: "pit_setup", label: "Pit Setup", file: "./checklists/pit_setup.xml" },
];

// Behavior toggles
const SETTINGS = {
  autoCollapseOnComplete: true,
  persistToLocalStorage: true,
  // storageKey becomes per-checklist: `${storageKeyPrefix}:${checklistId}`
  storageKeyPrefix: "robot-checklist"
};

const listEl = document.getElementById("list");
const barEl = document.getElementById("bar");
const progressTextEl = document.getElementById("progressText");
const titleEl = document.getElementById("title");
const gatePill = document.getElementById("gatePill");
const checklistSelect = document.getElementById("checklistSelect");
const themeBtn = document.getElementById("themeBtn");

let flat = [];
let nodesById = new Map();
let activeIndex = 0;
let currentChecklist = CHECKLISTS[0];

// ---------- Theme ----------
const THEME_KEY = "checklist-theme";
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  themeBtn.textContent = (theme === "light") ? "☀️" : "🌙";
  localStorage.setItem(THEME_KEY, theme);
}
applyTheme(localStorage.getItem(THEME_KEY) || "dark");
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  applyTheme(cur === "dark" ? "light" : "dark");
});

// ---------- Checklist select ----------
function populateChecklistSelect(){
  checklistSelect.innerHTML = "";
  CHECKLISTS.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.label;
    checklistSelect.appendChild(opt);
  });
  checklistSelect.value = currentChecklist.id;
}
populateChecklistSelect();

checklistSelect.addEventListener("change", async () => {
  const next = CHECKLISTS.find(c => c.id === checklistSelect.value);
  if (!next) return;
  await loadChecklist(next);
});

// ---------- Helpers ----------
function uid() {
  return Math.random().toString(16).slice(2) + Date.now().toString(16);
}

function parseXML(xmlString){
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlString, "application/xml");
  const parseError = doc.querySelector("parsererror");
  if (parseError) throw new Error("XML parse error");

  const root = doc.querySelector("checklist");
  const title = root.getAttribute("title") || "Checklist";
  titleEl.textContent = title;
  document.title = title;

  nodesById.clear();
  flat = [];

  function walk(el, level, parentId){
    if (el.tagName === "section") {
      const id = uid();
      const title = el.getAttribute("title") || "SECTION";
      const gate = el.getAttribute("gate") === "true";

      const node = { id, type:"section", title, level, parentId, childrenIds:[], done:false, collapsed:false, gate };
      nodesById.set(id, node);

      if (parentId) nodesById.get(parentId).childrenIds.push(id);
      flat.push(id);

      [...el.children].forEach(child => {
        if (child.tagName === "section" || child.tagName === "item") walk(child, level+1, id);
      });

      return;
    }

    if (el.tagName === "item") {
      const id = uid();
      const text = (el.textContent || "").trim();
      const node = { id, type:"item", text, level, parentId, childrenIds:[], done:false, collapsed:false, gate:false };
      nodesById.set(id, node);
      if (parentId) nodesById.get(parentId).childrenIds.push(id);
      flat.push(id);
    }
  }

  [...root.children].forEach(child => {
    if (child.tagName === "section") walk(child, 0, null);
  });
}

function descendants(sectionId){
  const out = [];
  const stack = [...nodesById.get(sectionId).childrenIds];
  while (stack.length){
    const id = stack.pop();
    out.push(id);
    const n = nodesById.get(id);
    if (n.type === "section") stack.push(...n.childrenIds);
  }
  return out;
}

function sectionItems(sectionId){
  return descendants(sectionId).filter(id => nodesById.get(id).type === "item");
}

function recomputeSectionDone(sectionId){
  const sec = nodesById.get(sectionId);
  if (!sec || sec.type !== "section") return;

  const itemIds = sectionItems(sectionId);
  const allDone = itemIds.length > 0 && itemIds.every(id => nodesById.get(id).done);
  sec.done = allDone;

  if (SETTINGS.autoCollapseOnComplete) sec.collapsed = allDone;
}

function recomputeAllSections(){
  [...flat].reverse().forEach(id => {
    const n = nodesById.get(id);
    if (n.type === "section") recomputeSectionDone(id);
  });
}

function isHiddenByCollapse(id){
  const n = nodesById.get(id);
  let p = n.parentId ? nodesById.get(n.parentId) : null;
  while (p){
    if (p.type === "section" && p.collapsed) return true;
    p = p.parentId ? nodesById.get(p.parentId) : null;
  }
  return false;
}

function gateLocked(sectionId){
  const sec = nodesById.get(sectionId);
  if (!(sec && sec.type==="section" && sec.gate)) return false;

  const idx = flat.indexOf(sectionId);
  if (idx < 0) return false;

  const beforeIds = flat.slice(0, idx);
  const beforeItems = beforeIds.filter(id => nodesById.get(id).type === "item");
  return beforeItems.some(id => !nodesById.get(id).done);
}

function isToggleAllowed(id){
  const n = nodesById.get(id);
  let p = n.type === "section" ? n : (n.parentId ? nodesById.get(n.parentId) : null);
  while (p){
    if (p.type === "section" && p.gate && gateLocked(p.id)) return false;
    p = p.parentId ? nodesById.get(p.parentId) : null;
  }
  return true;
}

function visibleRowIds(){
  return flat.filter(id => !isHiddenByCollapse(id));
}

function clampActiveToVisible(){
  const vis = visibleRowIds();
  if (!vis.length) return;
  const activeId = vis[activeIndex] ?? vis[0];
  activeIndex = Math.max(0, Math.min(vis.length-1, vis.indexOf(activeId)));
}

function updateProgress(){
  const allItemIds = flat.filter(id => nodesById.get(id).type === "item");
  const doneCount = allItemIds.filter(id => nodesById.get(id).done).length;
  const total = allItemIds.length;

  const pct = total ? Math.round((doneCount/total)*100) : 0;
  barEl.style.width = pct + "%";
  progressTextEl.textContent = `${doneCount}/${total} complete`;

  const gateSectionId = flat.find(id => nodesById.get(id).type==="section" && nodesById.get(id).gate);
  if (gateSectionId) {
    gatePill.style.display = gateLocked(gateSectionId) ? "inline-flex" : "none";
  } else {
    gatePill.style.display = "none";
  }
}

function storageKey(){
  return `${SETTINGS.storageKeyPrefix}:${currentChecklist.id}`;
}

function saveState(){
  if (!SETTINGS.persistToLocalStorage) return;
  const payload = {
    nodes: [...nodesById.values()].map(n => ({ id:n.id, type:n.type, done:n.done, collapsed:n.collapsed })),
    activeIndex
  };
  localStorage.setItem(storageKey(), JSON.stringify(payload));
}

function loadState(){
  if (!SETTINGS.persistToLocalStorage) return;
  const raw = localStorage.getItem(storageKey());
  if (!raw) return;
  try{
    const payload = JSON.parse(raw);
    const byId = new Map(payload.nodes.map(x => [x.id, x]));
    const allIdsMatch = payload.nodes && payload.nodes.length === nodesById.size &&
                        [...nodesById.keys()].every(id => byId.has(id));
    if (!allIdsMatch) return;

    byId.forEach((v,id)=>{
      const n = nodesById.get(id);
      n.done = !!v.done;
      n.collapsed = !!v.collapsed;
    });
    activeIndex = typeof payload.activeIndex === "number" ? payload.activeIndex : 0;
  }catch(e){}
}

function render(){
  listEl.innerHTML = "";
  const vis = visibleRowIds();

  if (activeIndex < 0) activeIndex = 0;
  if (activeIndex >= vis.length) activeIndex = vis.length-1;

  vis.forEach((id, i) => {
    const n = nodesById.get(id);
    const li = document.createElement("li");
    li.classList.add(`level-${Math.min(3, n.level)}`);
    if (i === activeIndex) li.classList.add("active");
    if (n.done) li.classList.add("done");
    if (n.type === "section") li.classList.add("sectionRow");
    if (n.type === "section" && n.collapsed) li.classList.add("collapsed");

    const circle = document.createElement("div");
    circle.className = "circle";
    const tick = document.createElement("span");
    tick.className = "tick";
    tick.textContent = "✓";
    circle.appendChild(tick);

    const twisty = document.createElement("div");
    twisty.className = "twisty";
    if (n.type === "section") {
      twisty.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
    } else {
      twisty.style.borderColor = "transparent";
    }

    const text = document.createElement("span");
    text.className = "text";
    text.textContent = (n.type === "section") ? n.title : n.text;

    const allowed = isToggleAllowed(id);
    if (!allowed) {
      li.style.opacity = "0.55";
      li.title = "Locked until earlier items are completed";
    }

    li.appendChild(circle);
    li.appendChild(twisty);
    li.appendChild(text);

    li.addEventListener("click", () => {
      activeIndex = i;
      if (n.type === "section") {
        n.collapsed = !n.collapsed;
      } else {
        toggleByVisibleIndex(i);
      }
      render();
    });

    listEl.appendChild(li);
  });

  updateProgress();
  listEl.querySelector("li.active")?.scrollIntoView({ block: "nearest" });
  saveState();
}

function toggleByVisibleIndex(visibleIndex){
  const vis = visibleRowIds();
  const id = vis[visibleIndex];
  const n = nodesById.get(id);
  if (!n || n.type !== "item") return;
  if (!isToggleAllowed(id)) return;

  n.done = !n.done;

  let p = n.parentId ? nodesById.get(n.parentId) : null;
  while (p) {
    if (p.type === "section") recomputeSectionDone(p.id);
    p = p.parentId ? nodesById.get(p.parentId) : null;
  }
}

function move(delta){
  const vis = visibleRowIds();
  activeIndex = Math.max(0, Math.min(vis.length-1, activeIndex + delta));
  render();
}

function toggleActive(){
  const vis = visibleRowIds();
  const id = vis[activeIndex];
  const n = nodesById.get(id);
  if (!n) return;

  if (n.type === "section") n.collapsed = !n.collapsed;
  else toggleByVisibleIndex(activeIndex);

  render();
}

function toggleCollapseActive(){
  const vis = visibleRowIds();
  const id = vis[activeIndex];
  const n = nodesById.get(id);
  if (n && n.type === "section") {
    n.collapsed = !n.collapsed;
    render();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Enter") { e.preventDefault(); toggleActive(); }
  else if (e.key === " ") { e.preventDefault(); toggleCollapseActive(); }
});

// ---------- Load checklist ----------
async function loadChecklist(checklist){
  currentChecklist = checklist;
  checklistSelect.value = checklist.id;

  // Reset UI while loading
  titleEl.textContent = "Loading…";
  listEl.innerHTML = "";
  barEl.style.width = "0%";
  progressTextEl.textContent = "";
  gatePill.style.display = "none";

  try{
    const res = await fetch(checklist.file, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} loading ${checklist.file}`);

    const xmlText = await res.text();
    parseXML(xmlText);

    activeIndex = 0;
    loadState();
    recomputeAllSections();
    clampActiveToVisible();
    render();
  }catch(err){
    console.error(err);
    titleEl.textContent = "Error loading checklist";
    progressTextEl.textContent = String(err);
  }
}

// Start
loadChecklist(currentChecklist);
</script>
</body>
</html>
